[project]
name = "nn-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "torch",
    "torchvision",
    "scikit-learn",
    "matplotlib",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 88
